name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request supersedes itself: a later push to a branch makes the run for the
  # earlier one pointless. A push to main is not like that. Merges land by fast-forward and
  # can arrive seconds apart, and cancelling the first leaves a commit on main whose recorded
  # verdict is "cancelled" — which is not a verdict, on the one branch where the answer has to
  # exist for every commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Consumers install these packages on both, so both have to stay green.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        # --locked-mode is what makes rule 3 binding rather than conventional: restore has to
        # reproduce the committed packages.lock.json exactly, so an upstream that drifted
        # inside its range fails here instead of entering a build unreviewed. A dependency
        # change is expected to arrive with its regenerated lock.
        run: dotnet restore --locked-mode

      - name: Verify formatting
        # One platform is enough: the check is byte-for-byte identical on the other.
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn
